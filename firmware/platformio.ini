; PlantCare - firmware do ESP32 (PlatformIO / CLion)
;
; O codigo esta na pasta "plantcare/" para poder ser aberto tambem no
; Arduino IDE (File > Open > plantcare/plantcare.ino).

[platformio]
src_dir = plantcare

[env:esp32dev]
platform = espressif32
board = esp32dev              ; ESP32 DevKit (ESP32-WROOM-32)
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    claws/BH1750